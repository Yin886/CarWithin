name: Build unsigned IPA (Ninebot 5-inch safe-area mod)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch bundled MFi identity from upstream release
        run: |
          mkdir -p App/BundledIdentity /tmp/idt
          curl -sL -o /tmp/idt/off.ipa https://github.com/xmz28/CarWithin/releases/download/v1.0.4/CarWithin-1.0.4-unsigned.ipa
          cd /tmp/idt && unzip -o -j off.ipa "Payload/TDSCarKit.app/certificate.p7b" "Payload/TDSCarKit.app/leaf.cer" "Payload/TDSCarKit.app/private.x963"
          cp certificate.p7b leaf.cer private.x963 "$GITHUB_WORKSPACE/App/BundledIdentity/"
          ls -la "$GITHUB_WORKSPACE/App/BundledIdentity/"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project TDSCarKit.xcodeproj -scheme TDSCarKit

      - name: Build (no code signing)
        run: |
          xcodebuild build \
            -project TDSCarKit.xcodeproj \
            -scheme TDSCarKit \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DD \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/DD/Build/Products/Release-iphoneos/TDSCarKit.app Payload/
          zip -qry CarWithin-5inch-safearea-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarWithin-5inch-safearea-unsigned-ipa
          path: CarWithin-5inch-safearea-unsigned.ipa
